name: Build, Test, and Publish NuGet

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  id-token: write

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-test-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Setup NuGet sources
        run: |
          dotnet nuget add source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" \
            --name github-packages \
            --username "${{ github.actor }}" \
            --password "${{ secrets.GITHUB_TOKEN }}" \
            --store-password-in-clear-text

      - name: Restore dependencies
        run: dotnet restore

      - name: Build (Release)
        run: dotnet build --configuration Release --no-restore

      - name: Run tests
        run: dotnet test --configuration Release --no-build --blame-hang --blame-hang-dump-type none --blame-hang-timeout 60s

      - name: Pack NuGet package
        run: dotnet pack src/Glacier.Graph/Glacier.Graph.csproj --configuration Release --no-build -o packages

      - name: Publish to GitHub Packages
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        run: dotnet nuget push "packages/*.nupkg" --api-key "${{ secrets.GITHUB_TOKEN }}" --source github-packages --skip-duplicate

      - name: NuGet OIDC Trusted Publishing Login
        id: nuget-login
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: NuGet/login@v1
        continue-on-error: true
        with:
          user: spuriousbugfix

      - name: Publish to nuget.org
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        env:
          OIDC_NUGET_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
          LEGACY_NUGET_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          EFFECTIVE_KEY="${OIDC_NUGET_KEY:-$LEGACY_NUGET_KEY}"
          if [ -z "$EFFECTIVE_KEY" ]; then
            echo "::error::Neither NuGet OIDC token nor NUGET_API_KEY secret is available."
            exit 1
          fi
          dotnet nuget push "packages/*.nupkg" --api-key "$EFFECTIVE_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Create GitHub Release
        if: github.event_name != 'pull_request' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: packages/*.nupkg
          generate_release_notes: true
